name: STREET LEGENDS GBA Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install devkitPro package manager
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -U "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0" -q https://apt.devkitpro.org/install-devkitpro-pacman -O /tmp/install-devkitpro-pacman
          chmod +x /tmp/install-devkitpro-pacman
          sed -i 's/wget /wget -U "Mozilla\/5.0 (Windows NT 10.0; Win64; x64) Chrome\/120.0.0.0" /g' /tmp/install-devkitpro-pacman
          sudo /tmp/install-devkitpro-pacman

      - name: Install GBA development tools
        run: |
          sudo dkp-pacman -Syu --noconfirm
          sudo dkp-pacman -S --noconfirm gba-dev
          echo "/opt/devkitpro/devkitARM/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"

      - name: Verify compiler and library
        run: |
          arm-none-eabi-gcc --version
          test -f "$DEVKITPRO/libgba/include/gba.h"

      - name: Compile ROM
        run: make clean all

      - name: Verify ROM output
        run: |
          test -s street-legends.gba
          file street-legends.gba
          ls -lh street-legends.gba

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: street-legends-phase-1
          path: street-legends.gba
          if-no-files-found: error
