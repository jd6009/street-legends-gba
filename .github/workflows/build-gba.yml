name: STREET LEGENDS GBA Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify GBA toolchain
        run: |
          export PATH="/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/opt/devkitpro/pacman/bin:$PATH"
          arm-none-eabi-gcc --version
          arm-none-eabi-objcopy --version
          command -v gbafix
          test -f "$DEVKITPRO/libgba/include/gba.h"
          echo "GBA toolchain verified."

      - name: Compile ROM
        run: |
          export PATH="/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/opt/devkitpro/pacman/bin:$PATH"
          make clean all

      - name: Verify GBA ROM header
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rom = Path("street-legends.gba")
          data = rom.read_bytes()

          logo = bytes.fromhex(
              "24 ff ae 51 69 9a a2 21 3d 84 82 0a 84 e4 09 ad"
              " 11 24 8b 98 c0 81 7f 21 a3 52 be 19 93 09 ce 20"
              " 10 46 4a 4a f8 27 31 ec 58 c7 e8 33 82 e3 ce bf"
              " 85 f4 df 94 ce 4b 09 c1 94 56 8a c0 13 72 a7 fc"
              " 9f 84 4d 73 a3 ca 9a 61 58 97 a3 27 fc 03 98 76"
              " 23 1d c7 61 03 04 ae 56 bf 38 84 00 40 a7 0e fd"
              " ff 52 fe 03 6f 95 30 f1 97 fb c0 85 60 d6 80 25"
              " a9 63 be 03 01 4e 38 e2 f9 a2 34 ff bb 3e 03 44"
               "78 00 90 cb 88 11 3a 94 65 c0 7c 63 87 f0 3c af"
          )

          if len(data) < 192:
              raise SystemExit(f"FAIL: ROM too short ({len(data)} bytes)")

          if data[4:4 + len(logo)] != logo:
              raise SystemExit("FAIL: Nintendo GBA logo signature is invalid")

          if data[0xA0:0xAC] != b"STREETLEGEND":
              raise SystemExit("FAIL: Unexpected GBA title field")

          print(f"PASS: Valid GBA header signature, {len(data)} bytes")
          print("Title:", data[0xA0:0xAC].decode("ascii"))
          PY
          ls -lh street-legends.gba
          sha256sum street-legends.gba

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: street-legends-phase-1
          path: street-legends.gba
          if-no-files-found: error
