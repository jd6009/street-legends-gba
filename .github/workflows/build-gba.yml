name: STREET LEGENDS GBA Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify GBA toolchain
        run: |
          export PATH="/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/opt/devkitpro/pacman/bin:$PATH"
          arm-none-eabi-gcc --version
          test -f "$DEVKITPRO/libgba/include/gba.h"
          echo "GBA compiler and library found."

      - name: Compile ROM
        run: |
          export PATH="/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/opt/devkitpro/pacman/bin:$PATH"
          make clean all

      - name: Verify ROM output
        run: |
          test -s street-legends.gba
          ls -lh street-legends.gba
          echo "ROM file exists and is not empty."

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: street-legends-phase-1
          path: street-legends.gba
          if-no-files-found: error
